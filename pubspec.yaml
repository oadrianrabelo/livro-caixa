name: livro_caixa
description: "Finanças da casa, offline."
publish_to: 'none'

# A versão é controlada pelo release-please (não edite na mão).
# O número de build do Android é calculado no CI a partir dela.
version: 0.6.1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  http: ^1.6.0
  cryptography: ^2.9.0
  package_info_plus: ^10.2.2
  file_picker: ^13.3.2
  flutter_localizations:
    sdk: flutter
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^3.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # Fontes embutidas (offline). Licença OFL em assets/fonts/*/OFL.txt.
  # Para adicionar outra: coloque o .ttf em assets/fonts/<nome>/, declare aqui
  # e registre em lib/ui/theme/fonts.dart.
  fonts:
    # Interface
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/Geist-Variable.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm_plex_sans/IBMPlexSans-Variable.ttf
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/atkinson/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # Letra de mão
    - family: Caveat
      fonts:
        - asset: assets/fonts/caveat/Caveat-Variable.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/kalam/Kalam-Regular.ttf
        - asset: assets/fonts/kalam/Kalam-Bold.ttf
          weight: 700
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/patrick_hand/PatrickHand-Regular.ttf
    - family: Gochi Hand
      fonts:
        - asset: assets/fonts/gochi_hand/GochiHand-Regular.ttf
    - family: Indie Flower
      fonts:
        - asset: assets/fonts/indie_flower/IndieFlower-Regular.ttf
    - family: Architects Daughter
      fonts:
        - asset: assets/fonts/architects_daughter/ArchitectsDaughter-Regular.ttf
    - family: Sue Ellen Francisco
      fonts:
        - asset: assets/fonts/sue_ellen/SueEllenFrancisco-Regular.ttf
    # Números
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/courier_prime/CourierPrime-Regular.ttf
        - asset: assets/fonts/courier_prime/CourierPrime-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/fonts/space_mono/SpaceMono-Regular.ttf
        - asset: assets/fonts/space_mono/SpaceMono-Bold.ttf
          weight: 700
    - family: Fira Code
      fonts:
        - asset: assets/fonts/fira_code/FiraCode-Variable.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/dm_mono/DMMono-Regular.ttf
        - asset: assets/fonts/dm_mono/DMMono-Medium.ttf
          weight: 500
    - family: Victor Mono
      fonts:
        - asset: assets/fonts/victor_mono/VictorMono-Variable.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/geist_mono/GeistMono-Variable.ttf
